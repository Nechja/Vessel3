apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vesselusers.vessel.nechja.io
spec:
  group: vessel.nechja.io
  names:
    kind: VesselUser
    listKind: VesselUserList
    plural: vesselusers
    singular: vesseluser
    shortNames:
      - vu
      - vuser
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Username
          type: string
          jsonPath: .spec.username
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Secret
          type: string
          jsonPath: .status.secretRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serverRef
                - username
                - writeSecret
              properties:
                serverRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                username:
                  type: string
                role:
                  type: string
                  enum:
                    - Member
                    - Admin
                    - ReadOnly
                  default: "Member"
                writeSecret:
                  type: object
                  required:
                    - secretName
                  properties:
                    secretName:
                      type: string
                    secretNamespace:
                      type: string
                    keys:
                      type: object
                      properties:
                        accessKey:
                          type: string
                          default: "AWS_ACCESS_KEY_ID"
                        secretKey:
                          type: string
                          default: "AWS_SECRET_ACCESS_KEY"
                        endpoint:
                          type: string
                          default: "S3_ENDPOINT"
                        region:
                          type: string
                          default: "AWS_REGION"
                        bucketName:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                userId:
                  type: string
                secretRef:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
