apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vesselbuckets.vessel.nechja.io
spec:
  group: vessel.nechja.io
  names:
    kind: VesselBucket
    listKind: VesselBucketList
    plural: vesselbuckets
    singular: vesselbucket
    shortNames:
      - vb
      - vbucket
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Bucket
          type: string
          jsonPath: .spec.bucketName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serverRef
                - bucketName
              properties:
                serverRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                bucketName:
                  type: string
                versioning:
                  type: string
                  enum:
                    - Enabled
                    - Suspended
                    - Disabled
                  default: "Disabled"
                access:
                  type: string
                  enum:
                    - private
                    - public-read
                  default: "private"
                prunePolicy:
                  type: string
                  enum:
                    - Retain
                    - Delete
                  default: "Retain"
                website:
                  type: object
                  required:
                    - indexDocument
                  properties:
                    indexDocument:
                      type: string
                    errorDocument:
                      type: string
                lifecycle:
                  type: object
                  properties:
                    expirationDays:
                      type: integer
                    expireNoncurrentVersionsDays:
                      type: integer
                    abortIncompleteMultipartDays:
                      type: integer
                cors:
                  type: array
                  items:
                    type: object
                    properties:
                      allowedOrigins:
                        type: array
                        items:
                          type: string
                      allowedMethods:
                        type: array
                        items:
                          type: string
                      allowedHeaders:
                        type: array
                        items:
                          type: string
                      maxAgeSeconds:
                        type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                sizeBytes:
                  type: integer
                objectCount:
                  type: integer
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
