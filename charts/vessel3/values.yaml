replicaCount: 1

image:
  repository: ghcr.io/nechja/vessel3
  pullPolicy: IfNotPresent
  tag: ""
  ui: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# 1654 is the user baked into the image (the .NET chiseled "app" user).
podSecurityContext:
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch
  # Required by the "restricted" Pod Security Standard.
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: s3.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 256Mi

storage:
  # Mount an existing PVC instead of the StatefulSet's volumeClaimTemplate.
  # Use this to adopt data from a previous install.
  existingClaim: ""
  size: 20Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# Optional multi-volume topology entries.
# Each item supports:
#   - id: nvme-hot
#     path: /volumes/nvme-hot
#     pool: hot
#     capabilities: Ingest
#     size: 50Gi
#     storageClassName: ""
#     accessModes: [ReadWriteOnce]
#     existingClaim: ""
volumes: []

# SWIM gossip cluster membership & cross-node volume discovery.
# Automatically enabled when replicaCount > 1 or cluster.enabled is true.
cluster:
  enabled: false
  gossipIntervalMs: 1000
  peerSuspectMs: 5000
  peerDeadMs: 15000
  # Optional Secret holding the shared cluster secret (falls back to auth secretKey).
  secretName: ""
  secretKey: cluster-secret
  secret: ""
  # Optional additional external seed peer URLs (in addition to StatefulSet replicas).
  peers: []

# Root credentials. With neither secretName nor accessKey/secretKey set the
# server runs with auth DISABLED (every request is anonymous admin).
auth:
  # Existing Secret holding the root keys.
  secretName: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key
  # Or have the chart create <fullname>-admin-creds from these. Both required.
  accessKey: ""
  secretKey: ""

config:
  # SigV4 signing region; clients must sign for the same one.
  region: ""
  # Raw VESSEL3_VOLUMES string override (e.g. "hot:/data/hot:nvme:Ingest,cold:/data/cold:archive:OnDemand").
  volumes: ""
  oidc:
    issuer: ""
    clientId: ""
    audience: ""

extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

metrics:
  enabled: true
  # Bearer token required on /metrics (VESSEL3_METRICS_TOKEN), from a Secret.
  # The ServiceMonitor scrapes with the same Secret. Without a token (or
  # VESSEL3_METRICS_ALLOW_ANONYMOUS=true in extraEnv) /metrics returns 404.
  token:
    secretName: ""
    key: token
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []

nodeSelector: {}
tolerations: []
affinity: {}
