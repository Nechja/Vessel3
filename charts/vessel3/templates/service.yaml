apiVersion: v1
kind: Service
metadata:
  name: {{ include "vessel3.fullname" . }}
  labels:
    {{- include "vessel3.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9000
      protocol: TCP
      name: s3
  selector:
    {{- include "vessel3.selectorLabels" . | nindent 4 }}
