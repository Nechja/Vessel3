apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vessel3.fullname" . }}
  labels:
    {{- include "vessel3.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "vessel3.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vessel3.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vessel3.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vessel3.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "vessel3.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          env:
            - name: VESSEL3_DATA
              value: /data
            - name: ASPNETCORE_URLS
              value: http://+:9000
            {{- with include "vessel3.authSecretName" . }}
            - name: VESSEL3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.accessKeyKey }}
            - name: VESSEL3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.secretKeyKey }}
            {{- end }}
            {{- with .Values.config.region }}
            - name: VESSEL3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.issuer }}
            - name: VESSEL3_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.clientId }}
            - name: VESSEL3_OIDC_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.audience }}
            - name: VESSEL3_OIDC_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.metrics.token.secretName }}
            - name: VESSEL3_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.metrics.token.key }}
            {{- end }}
            {{- with include "vessel3.volumesSpec" . }}
            - name: VESSEL3_VOLUMES
              value: {{ . | quote }}
            {{- end }}
            {{- if include "vessel3.clusterEnabled" . }}
            - name: VESSEL3_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VESSEL3_ADVERTISE_URL
              value: {{ printf "http://$(VESSEL3_NODE_ID).%s.%s.svc.cluster.local:%d" (include "vessel3.fullname" .) .Release.Namespace (int .Values.service.port) | quote }}
            - name: VESSEL3_PEERS
              value: {{ include "vessel3.peers" . | quote }}
            - name: VESSEL3_GOSSIP_INTERVAL_MS
              value: {{ .Values.cluster.gossipIntervalMs | quote }}
            - name: VESSEL3_PEER_SUSPECT_MS
              value: {{ .Values.cluster.peerSuspectMs | quote }}
            - name: VESSEL3_PEER_DEAD_MS
              value: {{ .Values.cluster.peerDeadMs | quote }}
            {{- with include "vessel3.clusterSecretName" . }}
            - name: VESSEL3_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.cluster.secretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: s3
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: s3
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- range .Values.volumes }}
            {{- if or .size .existingClaim }}
            - name: vol-{{ .id }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- $hasExistingVolumeClaims := false }}
      {{- range .Values.volumes }}
      {{- if .existingClaim }}{{- $hasExistingVolumeClaims = true }}{{- end }}
      {{- end }}
      {{- if or .Values.storage.existingClaim .Values.extraVolumes $hasExistingVolumeClaims }}
      volumes:
        {{- with .Values.storage.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- range .Values.volumes }}
        {{- if .existingClaim }}
        - name: vol-{{ .id }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- $hasVolumeTemplates := not .Values.storage.existingClaim }}
  {{- range .Values.volumes }}
  {{- if and .size (not .existingClaim) }}{{- $hasVolumeTemplates = true }}{{- end }}
  {{- end }}
  {{- if $hasVolumeTemplates }}
  volumeClaimTemplates:
    {{- if not .Values.storage.existingClaim }}
    - metadata:
        name: data
        labels:
          {{- include "vessel3.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.storage.accessModes | nindent 10 }}
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
    {{- end }}
    {{- range .Values.volumes }}
    {{- if and .size (not .existingClaim) }}
    - metadata:
        name: vol-{{ .id }}
        labels:
          {{- include "vessel3.labels" $ | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml (.accessModes | default (list "ReadWriteOnce")) | nindent 10 }}
        {{- if .storageClassName }}
        storageClassName: {{ .storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
    {{- end }}
    {{- end }}
  {{- end }}
