apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vessel3-operator.fullname" . }}
  labels:
    {{- include "vessel3-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - vessel.nechja.io
    resources:
      - vesselservers
      - vesselservers/status
      - vesselbuckets
      - vesselbuckets/status
      - vesselusers
      - vesselusers/status
      - vesselwebhooks
      - vesselwebhooks/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - pods
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
