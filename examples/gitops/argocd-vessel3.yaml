apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vessel3-core
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nechja/Vessel3.git
    targetRevision: HEAD
    path: charts/vessel3
    helm:
      values: |
        storage:
          size: 100Gi
          storageClassName: "local-path"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
